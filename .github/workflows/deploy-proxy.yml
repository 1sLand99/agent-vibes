name: Deploy Claude Proxy

on:
  push:
    branches:
      - main
    paths:
      - "apps/protocol-bridge/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore credentials from secrets
        working-directory: apps/protocol-bridge
        run: |
          mkdir -p data
          write_secret_file() {
            local value="$1"
            local dest="$2"
            if [ -z "$value" ]; then
              return
            fi
            if printf '%s' "$value" | base64 -d > "$dest" 2>/dev/null; then
              return
            fi
            printf '%s' "$value" > "$dest"
          }
          write_secret_file "$ANTIGRAVITY_ACCOUNTS" data/antigravity-accounts.json
          write_secret_file "$CODEX_ACCOUNTS" data/codex-accounts.json
          write_secret_file "$OPENAI_COMPAT_ACCOUNTS" data/openai-compat-accounts.json
          write_secret_file "$CLAUDE_API_ACCOUNTS" data/claude-api-accounts.json
          write_secret_file "$KIRO_ACCOUNTS" data/kiro-accounts.json
          wc -c data/*-accounts.json 2>/dev/null || true
        env:
          ANTIGRAVITY_ACCOUNTS: ${{ secrets.ANTIGRAVITY_ACCOUNTS }}
          CODEX_ACCOUNTS: ${{ secrets.CODEX_ACCOUNTS }}
          OPENAI_COMPAT_ACCOUNTS: ${{ secrets.OPENAI_COMPAT_ACCOUNTS }}
          CLAUDE_API_ACCOUNTS: ${{ secrets.CLAUDE_API_ACCOUNTS }}
          KIRO_ACCOUNTS: ${{ secrets.KIRO_ACCOUNTS }}

      - name: Build
        working-directory: apps/protocol-bridge
        run: npm run build

      - name: Prepare production bundle
        run: |
          node <<'NODE'
          const fs = require("fs")
          const path = require("path")

          const sourceDir = path.join("apps", "protocol-bridge")
          const bundleDir = path.join(".deploy-bundle")
          fs.rmSync(bundleDir, { recursive: true, force: true })
          fs.mkdirSync(bundleDir, { recursive: true })

          const pkg = JSON.parse(
            fs.readFileSync(path.join(sourceDir, "package.json"), "utf8")
          )
          delete pkg.devDependencies
          fs.writeFileSync(
            path.join(bundleDir, "package.json"),
            `${JSON.stringify(pkg, null, 2)}\n`
          )

          fs.cpSync(path.join(sourceDir, "dist"), path.join(bundleDir, "dist"), {
            recursive: true,
          })
          const dataDir = path.join(sourceDir, "data")
          if (fs.existsSync(dataDir)) {
            fs.cpSync(dataDir, path.join(bundleDir, "data"), {
              recursive: true,
            })
          } else {
            fs.mkdirSync(path.join(bundleDir, "data"), { recursive: true })
          }
          const envExample = [
            ".env.production.example",
            ".env.example",
          ]
            .map((name) => path.join(sourceDir, name))
            .find((filePath) => fs.existsSync(filePath))
          if (envExample) {
            fs.copyFileSync(
              envExample,
              path.join(bundleDir, ".env.production.example")
            )
          }
          NODE
          cd .deploy-bundle
          npm install --omit=dev --ignore-scripts

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ".deploy-bundle/dist/,.deploy-bundle/package.json,.deploy-bundle/node_modules/,.deploy-bundle/.env.production.example,.deploy-bundle/data/"
          target: "/opt/protocol-bridge"
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROXY_ENV_PRODUCTION: ${{ secrets.PROXY_ENV_PRODUCTION }}
          DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PROXY_ENV_PRODUCTION,DEPLOY_DOMAIN
          script: |
            cd /opt/protocol-bridge
            if [ -n "$PROXY_ENV_PRODUCTION" ]; then
              if ! printf '%s' "$PROXY_ENV_PRODUCTION" | base64 -d > .env 2>/dev/null; then
                printf '%s' "$PROXY_ENV_PRODUCTION" > .env
              fi
            elif [ -f .env.production ]; then
              cp .env.production .env
            else
              cp .env.production.example .env
            fi
            ensure_env_var() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            ensure_env_var AGENT_VIBES_DATA_DIR /opt/protocol-bridge
            if ! grep -q '^PROXY_API_KEY=.' .env 2>/dev/null; then
              echo "PROXY_API_KEY is required in PROXY_ENV_PRODUCTION"
              exit 1
            fi
            # Ensure Node.js 24 is installed
            if ! node --version 2>/dev/null | grep -q '^v24'; then
              curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
              apt-get install -y nodejs
            fi
            # node_modules are bundled from CI (monorepo workspace deps cannot install on server)
            rm -f package-lock.json
            # Setup SSL certificates for HTTPS/HTTP2
            mkdir -p /opt/protocol-bridge/certs
            ln -sf /etc/letsencrypt/live/$DEPLOY_DOMAIN/fullchain.pem /opt/protocol-bridge/certs/localhost.crt
            ln -sf /etc/letsencrypt/live/$DEPLOY_DOMAIN/privkey.pem /opt/protocol-bridge/certs/localhost.key
            # Register systemd service if not exists
            if [ ! -f /etc/systemd/system/protocol-bridge.service ]; then
              printf '%s\n' '[Unit]' 'Description=Protocol Bridge Service' 'After=network.target' '' '[Service]' 'Type=simple' 'WorkingDirectory=/opt/protocol-bridge' 'ExecStart=/usr/bin/node dist/main' 'Restart=on-failure' 'RestartSec=5' 'EnvironmentFile=/opt/protocol-bridge/.env' '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/protocol-bridge.service
              systemctl daemon-reload
              systemctl enable protocol-bridge
            fi
            systemctl restart protocol-bridge
